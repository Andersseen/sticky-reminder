<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Reminder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup" and-layout="vertical gap:md p:md">
      <and-card padded>
        <h1 class="heading" id="form-heading">New reminder</h1>
        <sr-reminder-form submit-label="Remind me"></sr-reminder-form>
      </and-card>

      <section and-layout="vertical gap:xs">
        <h2 class="heading">Upcoming</h2>
        <div id="reminders" and-layout="vertical gap:xs"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
