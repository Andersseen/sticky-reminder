<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Reminder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="sr-topbar">
      <div class="sr-brand">
        <img class="sr-brand-mark" src="/icon/48.png" alt="" width="22" height="22" />
        <span class="sr-brand-name">Sticky Reminder</span>
      </div>
      <div class="toolbar-actions">
        <!-- `title` only ever reached a mouse, and only after a browser-timed
             pause. `and-tooltip` shows on keyboard focus too, which is the
             whole of what these two icon-only buttons say about themselves.
             Placed to the left because the atom has no collision handling and
             these sit against the right edge of a 400px popup. -->
        <and-tooltip content="Open sidebar" placement="left" id="open-sidebar-tip" hidden>
          <and-button id="open-sidebar" variant="ghost" size="icon" aria-label="Open sidebar">
            <and-icon name="list" size="16"></and-icon>
          </and-button>
        </and-tooltip>
        <and-tooltip content="Open all reminders" placement="left">
          <and-button id="open-options" variant="ghost" size="icon" aria-label="Open all reminders">
            <and-icon name="settings" size="16"></and-icon>
          </and-button>
        </and-tooltip>
      </div>
    </header>

    <main class="popup" and-layout="vertical gap:md p:md">
      <and-card padded>
        <h1 class="heading" id="form-heading">New reminder</h1>
        <sr-reminder-form submit-label="Remind me"></sr-reminder-form>
      </and-card>

      <section and-layout="vertical gap:xs">
        <and-tabs class="sr-tabs" id="filters" default-value="pending" and-layout="vertical gap:xs">
          <div class="list-head">
            <h2 class="sr-label">Your reminders</h2>
            <and-tabs-list aria-label="Filter reminders">
              <and-tabs-trigger value="pending">
                Upcoming
                <and-badge data-count="pending">0</and-badge>
              </and-tabs-trigger>
              <and-tabs-trigger value="completed">
                Done
                <and-badge data-count="completed">0</and-badge>
              </and-tabs-trigger>
            </and-tabs-list>
          </div>
          <!-- One panel per filter: `and-tabs-content` owns the show/hide and
               the `aria-controls` pairing, and it generates its own id, so it
               is looked up by `value` rather than being given one. -->
          <and-tabs-content value="pending" and-layout="vertical gap:xs"></and-tabs-content>
          <and-tabs-content value="completed" and-layout="vertical gap:xs"></and-tabs-content>
        </and-tabs>
      </section>

      <p class="sr-hint footer-hint">
        <and-icon name="lock" size="11"></and-icon>
        Stored locally on this device. Nothing leaves your browser.
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
