name: Bug report
description: Something in the extension or the site does not work
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. A reminder that did not fire is always worth an issue.

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Extension popup
        - Extension options page
        - Notifications / scheduling
        - Website
        - Build or tooling
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Firefox 133, Edge 141…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a reminder for two minutes from now, repeating daily
        2. Close the popup
        3. Wait
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything logged by the popup, the options page or the background service worker.
      render: text
