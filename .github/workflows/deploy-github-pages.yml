name: Deploy site (GitHub Pages)

# The site's only live deploy target. Every push to main republishes, and each
# run shows up under the repository's Deployments as the `github-pages`
# environment. There was once a Cloudflare Pages target alongside it; nothing
# in the repo builds one now and its domain no longer resolves.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy supersedes one already in flight, but never cancels a run that
# is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        env:
          # A project site lives under /<repo>/, so the base path has to be
          # baked into the build rather than assumed to be the root.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Left empty so each page is its own canonical. This used to hardcode
          # a Cloudflare Pages domain that had stopped resolving, which pointed
          # every published page's canonical at a dead URL. Set the
          # SITE_CANONICAL repository variable to hand it back to a root-served
          # domain once there is a second live target to compete with — it is
          # applied without this deploy's `/<repo>/` prefix, which is exactly
          # what makes it wrong for a host that serves from a sub-path.
          SITE_CANONICAL: ${{ vars.SITE_CANONICAL }}
          PUBLIC_CHROME_STORE_URL: ${{ vars.PUBLIC_CHROME_STORE_URL }}
          PUBLIC_EDGE_STORE_URL: ${{ vars.PUBLIC_EDGE_STORE_URL }}
          PUBLIC_FIREFOX_STORE_URL: ${{ vars.PUBLIC_FIREFOX_STORE_URL }}
        run: pnpm build --filter=@sticky-reminder/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
