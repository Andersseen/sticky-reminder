name: Deploy site (GitHub Pages)

# One of the site's two deploy targets — see deploy-cloudflare-pages.yml for the
# other. Every push to main republishes, and each run shows up under the
# repository's Deployments as the `github-pages` environment.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy supersedes one already in flight, but never cancels a run that
# is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        env:
          # A project site lives under /<repo>/, so the base path has to be
          # baked into the build rather than assumed to be the root.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Both targets serve the same pages, so one of them has to own the
          # canonical tag or they compete as duplicates. Cloudflare is the
          # published address, so this deploy points there rather than at
          # itself; the repository variable overrides it if that ever flips.
          SITE_CANONICAL: ${{ vars.SITE_CANONICAL || 'https://sticky-reminder.pages.dev' }}
          PUBLIC_CHROME_STORE_URL: ${{ vars.PUBLIC_CHROME_STORE_URL }}
          PUBLIC_EDGE_STORE_URL: ${{ vars.PUBLIC_EDGE_STORE_URL }}
          PUBLIC_FIREFOX_STORE_URL: ${{ vars.PUBLIC_FIREFOX_STORE_URL }}
        run: pnpm build --filter=@sticky-reminder/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
