name: Release

# Publishes a GitHub Release with both browser builds, Firefox review sources
# and checksums. Three ways in:
#
# - Merging a version bump to main. release-on-merge.yml notices that
#   apps/extension/package.json names a version with no tag yet and calls this
#   workflow directly. Directly, because a tag pushed by GITHUB_TOKEN
#   deliberately does not start another workflow run — tagging and relying on
#   the trigger below would leave the release silently unpublished.
# - Pushing a tag by hand: `git tag v1.1.0 && git push origin v1.1.0`.
# - workflow_dispatch, which verifies everything and uploads the artifacts to
#   the run without publishing a release.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish under. Created at this commit if it does not exist.'
        type: string
        required: true
      submit_stores:
        description: 'Run enabled store submissions after verification'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Authenticate with enabled stores without uploading'
        type: boolean
        default: true
      submit_stores:
        description: 'Run enabled store submissions after verification'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Which tag this run publishes under, if any. A dispatch run has none: it
      # verifies the build and leaves the artifacts on the run.
      - name: Resolve the release tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          fi
          {
            echo "tag=$tag"
            echo "publish=$([ -n "$tag" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      # The tag names the release but the build takes its version from
      # package.json, so a mismatch ships zips that contradict the tag they hang
      # under. Cheap to check, and it fails before anything expensive runs.
      - name: Check the tag matches the extension version
        if: steps.target.outputs.publish == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          tag="${TAG#v}"
          pkg="$(jq -r .version apps/extension/package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag disagrees with apps/extension/package.json ($pkg). Bump the package or move the tag so both read the same."
            exit 1
          fi
          echo "Releasing v$tag."

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build workspace
        run: pnpm build

      - name: Zip the browser builds
        working-directory: apps/extension
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Package Firefox review sources
        run: |
          version="$(jq -r .version apps/extension/package.json)"
          git archive \
            --format=zip \
            --output="apps/extension/.output/sticky-reminder-$version-sources.zip" \
            "$GITHUB_SHA" \
            FIREFOX_REVIEW.md \
            LICENSE \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            tsconfig.json \
            tsconfig.base.json \
            site.config.mjs \
            site.config.d.mts \
            apps/extension \
            packages/core \
            packages/ui

      - name: Validate release artifacts
        run: |
          expected="$(jq -r .version apps/extension/package.json)"
          for manifest in \
            apps/extension/.output/chrome-mv3/manifest.json \
            apps/extension/.output/firefox-mv2/manifest.json; do
            actual="$(jq -r .version "$manifest")"
            test "$actual" = "$expected" || {
              echo "::error file=$manifest::Manifest version $actual does not match package version $expected."
              exit 1
            }
          done
          unzip -t "apps/extension/.output/sticky-reminder-$expected-chrome.zip"
          unzip -t "apps/extension/.output/sticky-reminder-$expected-firefox.zip"
          unzip -t "apps/extension/.output/sticky-reminder-$expected-sources.zip"
          unzip -Z1 "apps/extension/.output/sticky-reminder-$expected-sources.zip" \
            | grep -Fx 'packages/core/src/reminders.ts'
          unzip -Z1 "apps/extension/.output/sticky-reminder-$expected-sources.zip" \
            | grep -Fx 'packages/ui/src/index.ts'
          unzip -Z1 "apps/extension/.output/sticky-reminder-$expected-sources.zip" \
            | grep -Fx 'pnpm-lock.yaml'
          # wxt.config.ts imports this, so an archive without it cannot be
          # built by a reviewer — the manifest step above would still pass,
          # because it reads the build made here rather than from the archive.
          unzip -Z1 "apps/extension/.output/sticky-reminder-$expected-sources.zip" \
            | grep -Fx 'site.config.mjs'
          jq -e \
            '.browser_specific_settings.gecko.data_collection_permissions.required == ["none"]' \
            apps/extension/.output/firefox-mv2/manifest.json

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web E2E tests
        run: pnpm test:e2e

      - name: Run extension E2E tests
        working-directory: apps/extension
        run: pnpm test:e2e

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp apps/extension/.output/*.zip artifacts/
          cd artifacts
          sha256sum ./*.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-reminder-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: steps.target.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly: when this workflow is called after a merge the ref
          # is the branch, not the tag, so there is nothing to infer it from.
          # The tag is created here if it does not exist yet, which is what
          # keeps a failed release from leaving a tag with nothing under it.
          tag_name: ${{ steps.target.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Install

            **Chrome, Edge and other Chromium browsers** — download
            `sticky-reminder-*-chrome.zip`, unzip it, open `chrome://extensions`,
            turn on Developer mode and use **Load unpacked**.

            **Firefox** — download `sticky-reminder-*-firefox.zip`, open
            `about:debugging#/runtime/this-firefox` and use **Load Temporary Add-on**.

            Full instructions: https://andersseen.github.io/sticky-reminder/download

            `sticky-reminder-*-sources.zip` contains the corresponding source
            tree for Firefox review. Verify downloads with `SHA256SUMS.txt`.

      - name: Submit to Chrome Web Store
        if: ${{ (steps.target.outputs.publish == 'true' || inputs.submit_stores) && vars.SUBMIT_CHROME == 'true' }}
        working-directory: apps/extension
        env:
          STORE_DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          submit_args=()
          if [ -n "$STORE_DRY_RUN_FLAG" ]; then submit_args+=("$STORE_DRY_RUN_FLAG"); fi
          pnpm exec wxt submit "${submit_args[@]}" \
            --chrome-api-version v2 \
            --chrome-zip .output/*-chrome.zip

      - name: Submit to Firefox Add-ons
        if: ${{ (steps.target.outputs.publish == 'true' || inputs.submit_stores) && vars.SUBMIT_FIREFOX == 'true' }}
        working-directory: apps/extension
        env:
          STORE_DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          submit_args=()
          if [ -n "$STORE_DRY_RUN_FLAG" ]; then submit_args+=("$STORE_DRY_RUN_FLAG"); fi
          pnpm exec wxt submit "${submit_args[@]}" \
            --firefox-channel listed \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
