name: Release

# Tag a commit (`git tag v1.1.0 && git push origin v1.1.0`) and this publishes a
# GitHub Release with both browser builds, Firefox review sources and checksums.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Authenticate with enabled stores without uploading'
        type: boolean
        default: true
      submit_stores:
        description: 'Run enabled store submissions after verification'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag names the release but the build takes its version from
      # package.json, so a mismatch ships zips that contradict the tag they hang
      # under. Cheap to check, and it fails before anything expensive runs.
      - name: Check the tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version apps/extension/package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag disagrees with apps/extension/package.json ($pkg). Bump the package or move the tag so both read the same."
            exit 1
          fi
          echo "Releasing v$tag."

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build workspace
        run: pnpm build

      - name: Zip the browser builds
        working-directory: apps/extension
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Package Firefox review sources
        run: |
          version="$(jq -r .version apps/extension/package.json)"
          git archive \
            --format=zip \
            --output="apps/extension/.output/sticky-reminder-$version-sources.zip" \
            "$GITHUB_SHA" \
            FIREFOX_REVIEW.md \
            LICENSE \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            tsconfig.json \
            tsconfig.base.json \
            apps/extension \
            packages/core \
            packages/ui

      - name: Validate release artifacts
        run: |
          expected="$(jq -r .version apps/extension/package.json)"
          for manifest in \
            apps/extension/.output/chrome-mv3/manifest.json \
            apps/extension/.output/firefox-mv2/manifest.json; do
            actual="$(jq -r .version "$manifest")"
            test "$actual" = "$expected" || {
              echo "::error file=$manifest::Manifest version $actual does not match package version $expected."
              exit 1
            }
          done
          unzip -t "apps/extension/.output/sticky-reminder-$expected-chrome.zip"
          unzip -t "apps/extension/.output/sticky-reminder-$expected-firefox.zip"
          unzip -t "apps/extension/.output/sticky-reminder-$expected-sources.zip"
          unzip -Z1 "apps/extension/.output/sticky-reminder-$expected-sources.zip" \
            | grep -Fx 'packages/core/src/reminders.ts'
          unzip -Z1 "apps/extension/.output/sticky-reminder-$expected-sources.zip" \
            | grep -Fx 'packages/ui/src/index.ts'
          unzip -Z1 "apps/extension/.output/sticky-reminder-$expected-sources.zip" \
            | grep -Fx 'pnpm-lock.yaml'
          jq -e \
            '.browser_specific_settings.gecko.data_collection_permissions.required == ["none"]' \
            apps/extension/.output/firefox-mv2/manifest.json

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web E2E tests
        run: pnpm test:e2e

      - name: Run extension E2E tests
        working-directory: apps/extension
        run: pnpm test:e2e

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp apps/extension/.output/*.zip artifacts/
          cd artifacts
          sha256sum ./*.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-reminder-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Install

            **Chrome, Edge and other Chromium browsers** — download
            `sticky-reminder-*-chrome.zip`, unzip it, open `chrome://extensions`,
            turn on Developer mode and use **Load unpacked**.

            **Firefox** — download `sticky-reminder-*-firefox.zip`, open
            `about:debugging#/runtime/this-firefox` and use **Load Temporary Add-on**.

            Full instructions: https://sticky-reminder.pages.dev/download

            `sticky-reminder-*-sources.zip` contains the corresponding source
            tree for Firefox review. Verify downloads with `SHA256SUMS.txt`.

      - name: Submit to Chrome Web Store
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.submit_stores) && vars.SUBMIT_CHROME == 'true' }}
        working-directory: apps/extension
        env:
          STORE_DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          submit_args=()
          if [ -n "$STORE_DRY_RUN_FLAG" ]; then submit_args+=("$STORE_DRY_RUN_FLAG"); fi
          pnpm exec wxt submit "${submit_args[@]}" \
            --chrome-api-version v2 \
            --chrome-zip .output/*-chrome.zip

      - name: Submit to Firefox Add-ons
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.submit_stores) && vars.SUBMIT_FIREFOX == 'true' }}
        working-directory: apps/extension
        env:
          STORE_DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          submit_args=()
          if [ -n "$STORE_DRY_RUN_FLAG" ]; then submit_args+=("$STORE_DRY_RUN_FLAG"); fi
          pnpm exec wxt submit "${submit_args[@]}" \
            --firefox-channel listed \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
