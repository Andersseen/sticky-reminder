name: Release

# Tag a commit (`git tag v1.1.0 && git push --tags`) and this publishes a
# GitHub Release with the browser builds and the packed libraries attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the artifacts without publishing a release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Zip the browser builds
        working-directory: apps/extension
        run: |
          pnpm zip
          pnpm zip:firefox

      # The libraries are workspace-private, so they are published as packed
      # tarballs on the release rather than to a registry.
      - name: Pack the libraries
        run: |
          mkdir -p artifacts
          for pkg in core ui; do
            pnpm --filter "@sticky-reminder/$pkg" exec npm pack \
              --pack-destination "$GITHUB_WORKSPACE/artifacts"
          done

      - name: Collect artifacts
        run: cp apps/extension/.output/*.zip artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-reminder-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Install

            **Chrome, Edge and other Chromium browsers** — download
            `sticky-reminder-*-chrome.zip`, unzip it, open `chrome://extensions`,
            turn on Developer mode and use **Load unpacked**.

            **Firefox** — download `sticky-reminder-*-firefox.zip`, open
            `about:debugging#/runtime/this-firefox` and use **Load Temporary Add-on**.

            Full instructions: https://sticky-reminder.pages.dev/download

            The `sticky-reminder-core-*.tgz` and `sticky-reminder-ui-*.tgz`
            tarballs are the workspace libraries, installable straight from the
            file with `pnpm add ./sticky-reminder-core-*.tgz`.
